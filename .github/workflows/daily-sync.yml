name: Daily Meta Ads Sync

on:
  # Günde 2 kez: 06:30 ve 15:30 UTC (09:30 ve 18:30 Europe/Istanbul).
  # GitHub'ın schedule tetikleyicisi yük durumuna göre saatlerce gecikebiliyor
  # (gözlemlenen: 3-4 saat) ama bu artık kabul edilebilir — tamamen bulutta
  # çalıştığı için tek alternatifi (bir masaüstü uygulamasının açık kalmasına
  # bağımlı zamanlanmış görev) çok daha kırılgandı: bilgisayar kapalıyken
  # sessizce atlanıyordu.
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      dashboard-ready: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account file
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run sync
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_AQUA_DI_POLO: ${{ secrets.META_ACCESS_TOKEN_AQUA_DI_POLO }}
          META_ACCESS_TOKEN_FRIME: ${{ secrets.META_ACCESS_TOKEN_FRIME }}
          META_ACCESS_TOKEN_PIERRE_CARDIN: ${{ secrets.META_ACCESS_TOKEN_PIERRE_CARDIN }}
          SHOPIFY_ACCESS_TOKEN_FRIME: ${{ secrets.SHOPIFY_ACCESS_TOKEN_FRIME }}
          SHOPIFY_SHOP_FRIME: ${{ secrets.SHOPIFY_SHOP_FRIME }}
          SHOPIFY_ACCESS_TOKEN_AQUA_DI_POLO: ${{ secrets.SHOPIFY_ACCESS_TOKEN_AQUA_DI_POLO }}
          SHOPIFY_SHOP_AQUA_DI_POLO: ${{ secrets.SHOPIFY_SHOP_AQUA_DI_POLO }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ./service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python sync.py

      - name: Build dashboard
        id: build
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ./service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python build_dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
